name: CI

# Checks every push and pull request. Pushes to main also publish the Docker
# image as :main and deploy it to the public instance; version tags (v1.2.3)
# publish :v1.2.3 and :latest for self-hosters (T-S9, D29, D30).

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run web:build
      # The browser must never call Scryfall itself (T-S14).
      - run: npm run web:check

  image:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/mtgfanablecards
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=semver,pattern=v{{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The container starts and answers its health check.
      - name: Smoke test
        run: |
          image=$(echo "${{ steps.meta.outputs.tags }}" | head -n 1)
          docker run -d --name smoke -p 3000:3000 "$image"
          for i in $(seq 30); do
            curl -fsS http://localhost:3000/api/health && exit 0
            sleep 2
          done
          docker logs smoke
          exit 1

  # Off until the VPS exists: set the repository variable DEPLOY_HOST (and
  # DEPLOY_USER, DEPLOY_PATH) and the secrets DEPLOY_SSH_KEY and
  # DEPLOY_KNOWN_HOSTS (docs/self-hosting.md, "Continuous deployment").
  # End the head commit's message with [skip deploy] to publish the image
  # without deploying it.
  deploy:
    needs: image
    if: >-
      github.ref == 'refs/heads/main' && vars.DEPLOY_HOST != '' &&
      !endsWith(github.event.head_commit.message, '[skip deploy]')
    runs-on: ubuntu-latest
    concurrency: deploy
    env:
      TARGET: ${{ vars.DEPLOY_USER || 'deploy' }}@${{ vars.DEPLOY_HOST }}
      DIR: ${{ vars.DEPLOY_PATH || '~/fannable' }}
    steps:
      - uses: actions/checkout@v4
      - name: SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519
      # The Compose setup comes from the repository; settings stay in the
      # server's .env. Running jobs finish before the old container stops.
      - name: Deploy
        run: |
          scp docker-compose.yml Caddyfile "$TARGET:$DIR/"
          ssh "$TARGET" "cd $DIR && docker compose pull && docker compose up -d --remove-orphans"
